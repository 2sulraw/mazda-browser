[package]
name = "mazda-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mazda_engine"
path = "src/lib.rs"

[[bin]]
name = "mazda"
path = "src/main.rs"

[dependencies]
mazda-ipc = { path = "../ipc" }

# process RSS reporting (Windows only)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_System_ProcessStatus"] }

[dependencies.ureq]
version = "2"

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]

[dependencies.webpki-roots]
version = "0.26"

[dependencies.ab_glyph]
version = "0.2.32"

[dependencies.url]
version = "2.5.8"

[dependencies.encoding_rs]
version = "0.8.42"

[dependencies.png]
version = "0.17"

[dependencies.jpeg-decoder]
version = "0.3"
default-features = false

[dependencies.image-webp]
version = "0.2.4"
default-features = false

[dependencies.boa_engine]
version = "0.22.0"
optional = true

[dependencies.flate2]
version = "1"

[dependencies.wuff]
version = "0.2.9"
optional = true
default-features = false
features = ["brotli"]

[dependencies.eframe]
version = "0.37"
default-features = false
features = ["glow", "default_fonts", "x11", "wayland", "clipboard"]

[features]
engine-b = ["dep:boa_engine"]
woff2 = ["dep:wuff"]
# diagnostic: counting global allocator (see `live_alloc_bytes`)
count-alloc = []
