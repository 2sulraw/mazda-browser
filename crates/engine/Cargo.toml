[package]
name = "mazda-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mazda_engine"
path = "src/lib.rs"

[[bin]]
name = "mazda"
path = "src/main.rs"

[dependencies]
mazda-ipc = { path = "../ipc" }
mazda-media = { path = "../media" }

# process RSS reporting (Windows only)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_System_ProcessStatus"] }

[dependencies.ureq]
version = "2"

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]

[dependencies.webpki-roots]
version = "0.26"

[dependencies.ab_glyph]
version = "0.2.32"

[dependencies.url]
version = "2.5.8"

[dependencies.encoding_rs]
version = "0.8.42"

[dependencies.png]
version = "0.17"

[dependencies.jpeg-decoder]
version = "0.3"
default-features = false

[dependencies.image-webp]
version = "0.2.4"
default-features = false

[dependencies.boa_engine]
version = "0.22.0"
optional = true

[dependencies.flate2]
version = "1"

# `Intl.Segmenter`: extended grapheme clusters (UAX #29) and word/sentence
# boundaries. Already in the lock file through eframe's text layout.
[dependencies.unicode-segmentation]
version = "1"

# HTTP `Content-Encoding: br`. Not ureq's `brotli` feature: that one pins
# brotli-decompressor 4.0.0, which this project's offline registry does not
# carry. 5.0.3 is available, so the header and the decode are ours.
[dependencies.brotli-decompressor]
version = "5"
default-features = false
features = ["std"]

# HTTP/2 (P67). ureq 2 is HTTP/1.1-only, so h2 needs its own client; hyper's
# legacy client gives per-origin connection pooling + multiplexing over one
# TLS connection. The engine stays synchronous: h2net bridges with block_on.
[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "net", "time"]

[dependencies.hyper]
version = "1"
default-features = false
features = ["client", "http1", "http2"]

[dependencies.hyper-util]
version = "0.1"
default-features = false
features = ["client-legacy", "http1", "http2", "tokio"]

[dependencies.hyper-rustls]
version = "0.27"
default-features = false
features = ["http1", "http2", "ring", "tls12"]

[dependencies.http-body-util]
version = "0.1"

[dependencies.bytes]
version = "1"

[dependencies.wuff]
version = "0.2.9"
optional = true
default-features = false
features = ["brotli"]

[dependencies.eframe]
version = "0.37"
default-features = false
features = ["glow", "default_fonts", "x11", "wayland", "clipboard"]

[features]
engine-b = ["dep:boa_engine"]
woff2 = ["dep:wuff"]
# diagnostic: counting global allocator (see `live_alloc_bytes`)
count-alloc = []
