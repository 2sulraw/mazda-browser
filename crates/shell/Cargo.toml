[package]
name = "mazda-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shell"
path = "src/main.rs"

[dependencies]
mazda-ipc = { path = "../ipc" }

[dependencies.eframe]
version = "0.37"
default-features = false
features = ["glow", "default_fonts", "x11", "wayland", "clipboard"]

# private bytes of the supervised renderer (governor)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
